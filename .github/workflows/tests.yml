name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Python + JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyflakes
      - name: pyflakes
        run: python -m pyflakes app.py tests
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sintaxis de static/app.js
        run: node --check static/app.js

  unit:
    name: Unit · Python ${{ matrix.python }}${{ matrix.orjson && ' + orjson' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        orjson: [false]
        include:
          - python: "3.12"
            orjson: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt pytest
      - if: matrix.orjson
        run: pip install orjson
      - name: pytest
        run: python -m pytest --ignore=tests/test_e2e.py

  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: pytest e2e
        run: python -m pytest tests/test_e2e.py
